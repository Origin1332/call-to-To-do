name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # 생성 코드(*.g.dart, *.freezed.dart, Pigeon)는 커밋되어 있어야 한다.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run pigeon --input pigeons/calendar_api.dart
          git diff --exit-code -- lib android/app/src/main/kotlin

      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded

  build-apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

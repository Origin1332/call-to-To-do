name: call_to_todo
description: "통화 녹음과 메신저 알림에서 일정을 추출해 확인 후 기기 캘린더(구글 계정 동기화)에 등록하는 Android 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리 / 라우팅
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.2

  # 불변 모델 / 직렬화
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 로컬 저장소
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0

  # 네트워크 (앱 내 유일한 HTTP 클라이언트는 core/privacy 에서만 생성)
  http: ^1.6.0
  google_generative_ai: ^0.4.7

  # 확인 팝업 알림
  flutter_local_notifications: ^22.3.3

  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  pigeon: ^29.1.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
